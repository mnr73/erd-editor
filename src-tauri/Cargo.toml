[package]
name = "erd-editor"
version = "1.1.0"
description = "Local ERD diagram editor"
authors = ["mnrTech"]
license = "MIT"
repository = "https://github.com/mnr73/erd-editor"
homepage = "https://mnr73.github.io/erd-editor/"
edition = "2021"
rust-version = "1.80"

[lib]
name = "erd_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Linux: use the desktop's own file dialog (KDE, GNOME, ...) through the XDG portal instead of GTK's.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
