[package]
name = "erd-editor"
version = "1.0.0"
description = "Local ERD diagram editor"
authors = ["mnrTech"]
license = "MIT"
repository = "https://github.com/mnr73/erd-editor"
homepage = "https://mnr73.github.io/erd-editor/"
edition = "2021"
rust-version = "1.80"

[lib]
name = "erd_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
